<title>Controle de Agenda</title>

<style>
  /* Layout: coluna única estreita, semana em blocos por dia; o status de cada reunião é um seletor na própria linha. */
  :root {
    --bg: #f5f4f2;
    --surface: #ffffff;
    --fg: #1f2124;
    --muted: #6a6e74;
    --line: #dedcd8;
    --ink: #2b2f36;
    --ink-fg: #ffffff;
    --ok: #1f7a4d;
    --ok-bg: #e2f1e8;
    --bad: #b3261e;
    --bad-bg: #f9e3e1;
    --sp: #1f5f8b;
    --sp-bg: #dde9f4;
    --hol: #1b5e8f;
    --hol-bg: #d6ecfb;
    --hol-line: #9fcdea;
    --warn: #9a6200;
    --warn-bg: #f8ecd2;
    --idle-bg: #eceae6;
    --font-display: "Archivo", "Arial Narrow", Arial, sans-serif;
    --font-body: "IBM Plex Sans", Arial, sans-serif;
    --font-mono: "IBM Plex Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17191c; --surface: #202327; --fg: #ebe9e5; --muted: #9a9ea5; --line: #33373d;
      --ink: #d9dbe0; --ink-fg: #17191c;
      --ok: #62c58f; --ok-bg: #1d3a2b; --bad: #f08a82; --bad-bg: #402220; --sp: #7cb4e4; --sp-bg: #1b3146; --hol: #8fc7ee; --hol-bg: #183548; --hol-line: #2d5d7c;
      --warn: #e5b45a; --warn-bg: #3d3014; --idle-bg: #2a2d32;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17191c; --surface: #202327; --fg: #ebe9e5; --muted: #9a9ea5; --line: #33373d;
    --ink: #d9dbe0; --ink-fg: #17191c;
    --ok: #62c58f; --ok-bg: #1d3a2b; --bad: #f08a82; --bad-bg: #402220; --sp: #7cb4e4; --sp-bg: #1b3146; --hol: #8fc7ee; --hol-bg: #183548; --hol-line: #2d5d7c;
    --warn: #e5b45a; --warn-bg: #3d3014; --idle-bg: #2a2d32;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
    padding-block: 24px 64px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  button, input, select { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
  h1 { font-family: var(--font-display); font-size: 1.9rem; line-height: 1.1; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  .sub { color: var(--muted); font-size: 0.85rem; margin: 4px 0 0; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; }
  .tab.sync { background: var(--surface); }
  .tab.sync:disabled { opacity: 0.6; cursor: progress; }
  .tab { border: 1px solid var(--line); background: transparent; padding: 6px 14px; border-radius: 6px; cursor: pointer; }
  .tab[aria-pressed="true"] { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }

  .weekbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .weekbar h2 { font-family: var(--font-display); font-size: 1.25rem; margin: 0; flex: 1 1 220px; text-wrap: balance; }
  .nav { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  .nav:hover { border-color: var(--ink); }

  .summary { display: flex; flex-direction: column; gap: 10px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px 28px; }
  .stat { display: flex; flex-direction: column; }
  .stat b { font-family: var(--font-display); font-size: 1.7rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .stat.ok b { color: var(--ok); } .stat.bad b { color: var(--bad); } .stat.warn b { color: var(--warn); } .stat.sp b { color: var(--sp); }
  .bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--idle-bg); }
  .bar i { display: block; height: 100%; }
  .bar .b-ok { background: var(--ok); } .bar .b-bad { background: var(--bad); } .bar .b-warn { background: var(--warn); } .bar .b-sp { background: var(--sp); }
  .alert { margin: 0; font-size: 0.88rem; color: var(--warn); }

  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cal-h { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); text-align: center; padding: 2px 0; font-weight: 600; }
  .cell { min-height: 78px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; cursor: pointer; }
  .cell:hover { border-color: var(--ink); }
  .cell.out { background: transparent; opacity: 0.5; }
  .cell.hol { background: var(--hol-bg); border-color: var(--hol-line); }
  .hol-nome { font-size: 0.68rem; line-height: 1.15; font-weight: 600; color: var(--hol); }
  .d-hol { background: var(--hol-bg); box-shadow: inset 0 0 0 1px var(--hol-line); }
  .cell.pend { border-color: var(--warn); }
  .cell.sel { border-color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); opacity: 1; }
  .num { font-family: var(--font-display); font-weight: 700; font-size: 0.9rem; line-height: 1.3; padding: 0 6px; margin-left: -6px; }
  .cell.today .num { background: var(--ink); color: var(--ink-fg); border-radius: 10px; }
  .cnt { font-size: 0.72rem; color: var(--muted); line-height: 1.1; }
  .dots { display: flex; flex-wrap: wrap; gap: 3px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .d-ok { background: var(--ok); } .d-bad { background: var(--bad); } .d-warn { background: var(--warn); } .d-idle { background: var(--muted); } .d-sp { background: var(--sp); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.78rem; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .day-title { font-family: var(--font-display); font-size: 1.15rem; margin: 0; scroll-margin-top: 12px; }
  @media (max-width: 520px) { .cell { min-height: 54px; padding: 4px; } .cnt, .hol-nome { display: none; } .num { margin-left: -4px; } }
  .overlay { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center;
    padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .modal { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; width: min(680px, 100%); max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35); }
  .modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
  .modal-body { overflow-y: auto; overscroll-behavior: contain; padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 10px; }
  .x { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 14px; cursor: pointer; white-space: nowrap; }
  .x:hover { border-color: var(--ink); }
  .day { display: flex; flex-direction: column; gap: 8px; }
  .day h3 { font-family: var(--font-display); font-size: 0.95rem; margin: 8px 0 0; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
  .meet { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 14px; }
  .time { font-family: var(--font-mono); font-size: 0.85rem; padding-top: 2px; font-variant-numeric: tabular-nums; }
  .what { min-width: 0; }
  .what strong { font-weight: 600; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 0.82rem; display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 2px; }
  .chip { font-size: 0.72rem; font-weight: 600; padding: 1px 8px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); }
  .chip.bad { background: var(--bad-bg); color: var(--bad); }
  .status { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .st { border: 1px solid var(--line); background: transparent; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
  .st:hover { border-color: var(--ink); }
  .st[aria-pressed="true"].s-realizada { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); font-weight: 600; }
  .st[aria-pressed="true"].s-cancelada { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); font-weight: 600; }
  .st[aria-pressed="true"].s-cancelada_sem_pendencia { background: var(--sp-bg); color: var(--sp); border-color: var(--sp); font-weight: 600; }
  .st[aria-pressed="true"].s-remarcada { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); font-weight: 600; }
  .st[aria-pressed="true"].s-prevista { background: var(--idle-bg); border-color: var(--muted); font-weight: 600; }
  .reason { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 4px; }
  .reason input { flex: 1 1 260px; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
  .reason input.err { border-color: var(--bad); }
  .reason .msg { color: var(--bad); font-size: 0.82rem; flex-basis: 100%; }
  .go { border: 0; background: var(--bad); color: #fff; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .link { border: 0; background: none; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 4px; }
  .shown-reason { grid-column: 1 / -1; background: var(--bad-bg); color: var(--fg); border-radius: 6px; padding: 8px 12px; font-size: 0.9rem; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .shown-reason span { overflow-wrap: anywhere; }
  .shown-reason b { color: var(--bad); }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .panel h3 { margin: 0; font-family: var(--font-display); font-size: 1.05rem; }
  .cancel-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .cancel-list li { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 2px 12px; font-size: 0.9rem; }
  .cancel-list .d { color: var(--muted); font-family: var(--font-mono); font-size: 0.82rem; }
  .cancel-list .r { color: var(--muted); grid-column: 2; overflow-wrap: anywhere; }

  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--idle-bg); }

  details.add { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
  details.add summary { cursor: pointer; font-weight: 600; }
  .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
  .form label { display: flex; flex-direction: column; gap: 3px; font-size: 0.8rem; color: var(--muted); min-width: 0; }
  .form input { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); min-width: 0; }
  .form .wide { grid-column: 1 / -1; }
  .primary { border: 0; background: var(--ink); color: var(--ink-fg); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; justify-self: start; }

  .empty { text-align: left; padding: 28px 0; color: var(--muted); max-width: 52ch; }
  .empty b { color: var(--fg); display: block; margin-bottom: 4px; font-family: var(--font-display); font-size: 1.1rem; }
  .banner { padding: 10px 14px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); font-size: 0.9rem; }
  @media (max-width: 520px) {
    .meet { grid-template-columns: minmax(0, 1fr); }
    .cancel-list li { grid-template-columns: minmax(0, 1fr); }
    .cancel-list .r { grid-column: 1; }
  }
  @media (prefers-reduced-motion: no-preference) { .bar i { transition: width .25s ease; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Controle de Agenda</h1>
      <p class="sub">Reuniões da semana: o que aconteceu e o que foi cancelado, com o motivo.</p>
      <p class="sub" id="sync-msg" role="status"></p>
    </div>
    <div class="tabs" role="group" aria-label="Tela">
      <button class="tab" id="tab-semana" aria-pressed="true">Calendário</button>
      <button class="tab" id="tab-historico" aria-pressed="false">Histórico</button>
      <button class="tab sync" id="btn-sync" hidden>Atualizar calendário</button>
      <button class="tab sync" id="btn-git" hidden>Conectar ao GitHub</button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="view"></main>
</div>

<script>
(function () {
  var STATUS = [
    { id: 'prevista', label: 'Prevista' },
    { id: 'realizada', label: 'Realizada' },
    { id: 'cancelada', label: 'Cancelada' },
    { id: 'cancelada_sem_pendencia', label: 'Cancelada sem Pendência' },
    { id: 'remarcada', label: 'Remarcada' }
  ];
  var DIAS = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
  var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

  var db = null;
  var docs = {};          // id -> dados
  var tela = 'semana';
  var drafts = {};        // id -> texto do motivo em edição
  var errors = {};        // id -> mensagem
  var editing = {};       // id -> true quando o campo de motivo está aberto
  var addOpen = false;
  var dayOpen = false;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function parse(iso) { var p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function mondayOf(d) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); var wd = (x.getDay() + 6) % 7; x.setDate(x.getDate() - wd); return x; }
  function addDays(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
  function shortDate(d) { return d.getDate() + ' de ' + MESES[d.getMonth()]; }
  function toMin(hhmm) { var p = (hhmm || '0:0').split(':'); return (+p[0]) * 60 + (+p[1]); }
  function nowMin() { var n = new Date(); return n.getHours() * 60 + n.getMinutes(); }

  var today0 = new Date();
  var monthStart = new Date(today0.getFullYear(), today0.getMonth(), 1);
  var selDay = iso(today0);
  function sameMonth(isoDay) { var d = parse(isoDay); return d.getFullYear() === monthStart.getFullYear() && d.getMonth() === monthStart.getMonth(); }
  function goMonth(delta) {
    monthStart = new Date(monthStart.getFullYear(), monthStart.getMonth() + delta, 1);
    if (!sameMonth(selDay)) selDay = sameMonth(iso(new Date())) ? iso(new Date()) : iso(monthStart);
  }
  function openDay(isoDay, show) { var d = parse(isoDay); monthStart = new Date(d.getFullYear(), d.getMonth(), 1); selDay = isoDay; dayOpen = !!show; tela = 'semana'; }

  function list() { return Object.keys(docs).map(function (id) { var d = docs[id]; d.id = id; return d; }); }
  function between(a, b) {
    return list().filter(function (m) { return m.data >= a && m.data <= b; })
      .sort(function (x, y) { return (x.data + x.inicio).localeCompare(y.data + y.inicio); });
  }
  function isPastUnregistered(m) {
    if (m.status !== 'prevista') return false;
    var today = iso(new Date());
    if (m.data < today) return true;
    return m.data === today && toMin(m.fim) < nowMin();
  }
  // Feriados nacionais (de lei federal). Carnaval e Corpus Christi nao entram: sao ponto facultativo.
  var feriadosAno = {};
  function pascoa(ano) {
    var a = ano % 19, b = Math.floor(ano / 100), c = ano % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
    var h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
    var mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(ano, mes - 1, dia);
  }
  function feriadosDe(ano) {
    if (feriadosAno[ano]) return feriadosAno[ano];
    var f = {};
    f[ano + '-01-01'] = 'Confraterniza\u00e7\u00e3o Universal';
    f[iso(addDays(pascoa(ano), -2))] = 'Sexta-feira Santa';
    f[ano + '-04-21'] = 'Tiradentes';
    f[ano + '-05-01'] = 'Dia do Trabalho';
    f[ano + '-09-07'] = 'Independ\u00eancia do Brasil';
    f[ano + '-10-12'] = 'Nossa Senhora Aparecida';
    f[ano + '-11-02'] = 'Finados';
    f[ano + '-11-15'] = 'Proclama\u00e7\u00e3o da Rep\u00fablica';
    f[ano + '-11-20'] = 'Dia da Consci\u00eancia Negra';
    f[ano + '-12-25'] = 'Natal';
    feriadosAno[ano] = f;
    return f;
  }
  function feriado(isoDia) { return feriadosDe(+isoDia.slice(0, 4))[isoDia] || ''; }
  function isCanc(m) { return m.status === 'cancelada' || m.status === 'cancelada_sem_pendencia'; }
  function counts(items) {
    var c = { total: items.length, realizada: 0, cancelada: 0, cancelada_sem_pendencia: 0, remarcada: 0, prevista: 0, semRegistro: 0 };
    items.forEach(function (m) { c[m.status] = (c[m.status] || 0) + 1; if (isPastUnregistered(m)) c.semRegistro++; });
    return c;
  }
  function conflictIds(items) {
    var out = {};
    var active = items.filter(function (m) { return m.status === 'prevista' || m.status === 'realizada'; });
    for (var i = 0; i < active.length; i++) for (var j = i + 1; j < active.length; j++) {
      var a = active[i], b = active[j];
      if (a.data === b.data && toMin(a.inicio) < toMin(b.fim) && toMin(b.inicio) < toMin(a.fim)) { out[a.id] = true; out[b.id] = true; }
    }
    return out;
  }

  function renderSemana() {
    var first = monthStart;
    var last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
    var items = between(iso(first), iso(last));
    var c = counts(items);

        if (ev.isCancelled) return;
        var a = partes(ev.start || {}), b = partes(ev.end || {});
        var assunto = String(ev.subject || '').replace(/\s+/g, ' ').trim() || '(sem assunto)';
        var inicio = ev.isAllDay ? '00:00' : a.hora;
        var fimH = ev.isAllDay ? '23:59' : (b.dia !== a.dia ? '23:59' : b.hora);
        var k = a.dia + '|' + inicio + '|' + norm(assunto);
        // O nome vem sempre do Outlook: se mudou la, atualiza aqui (so o assunto; o registro da reuniao nao muda).
        var did = ev.id && porOutlook[ev.id];
        if (did) { if (docs[did].assunto !== assunto) ajustes.push({ id: did, patch: { assunto: assunto } }); return; }
        if (porChave[k] && ev.id) { ajustes.push({ id: porChave[k], patch: { outlookId: ev.id } }); delete porChave[k]; return; }
        if (existentes[k]) return;
        existentes[k] = true;
        var base = a.dia.replace(/-/g, '') + '-' + inicio.replace(':', '') + '-' + (slug(assunto) || 'reuniao'), id = base, n = 2;
        while (ids[id]) { id = base + '-' + n; n++; }
        ids[id] = true;
        novos.push({ id: id, dados: { data: a.dia, inicio: inicio, fim: fimH, assunto: assunto, local: ajustaLocal(ev.location), organizador: !!ev.isOrganizer, status: 'prevista', motivo: '', outlookId: ev.id || '' } });
      });
      var cadeia = Promise.resolve();
      ajustes.forEach(function (j) { cadeia = cadeia.then(function () { return db.doc('reunioes/' + j.id).update(j.patch); }); });
      novos.forEach(function (n) { cadeia = cadeia.then(function () { return db.doc('reunioes/' + n.id).set(n.dados); }); });
      return cadeia.then(function () {
        return db.doc('config/sync').set({ em: new Date().toISOString(), novas: novos.length, origem: 'botao' }).catch(function () {});
      }).then(function () { return { qtd: novos.length, total: eventos.length }; });
    }).then(function (r) {
      syncing = false;
      setSync(r.total ? '' : 'O Outlook não devolveu reuniões para os próximos ' + SYNC_DIAS + ' dias.', false);
    }).catch(function (e) { syncing = false; setSync(erroSync(e), false); });
  }

  var timer = null;
  var modoLocal = false;
  var NOTA_LOCAL = 'Modo local: os registros ficam salvos só neste navegador, neste aparelho.';
  function okBanner() { banner(''); }

  // Pagina do GitHub: os registros ficam no reunioes.json do repositorio, gravado pela API do GitHub.
  // A pessoa cola UMA vez um token neste navegador. O token nunca vai para o codigo.
  var GH_REPO = 'brunockawasaki/controle-de-agenda', GH_ARQ = 'reunioes.json', GH_CHAVE = 'controle-de-agenda-gh-token';
  function ghToken() { try { return localStorage.getItem(GH_CHAVE) || ''; } catch (e) { return ''; } }
  function ghSalvaToken(t) { try { if (t) localStorage.setItem(GH_CHAVE, t); else localStorage.removeItem(GH_CHAVE); } catch (e) {} }
  function deB64(b) { var bin = atob(String(b).replace(/\s/g, '')); var by = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) by[i] = bin.charCodeAt(i); return new TextDecoder().decode(by); }
  function paraB64(t) { var by = new TextEncoder().encode(t); var bin = ''; for (var i = 0; i < by.length; i++) bin += String.fromCharCode(by[i]); return btoa(bin); }
  function ordena(o) { var r = {}; Object.keys(o).sort().forEach(function (k) { r[k] = o[k]; }); return r; }
  function erroGh(r) {
    var e = new Error('http ' + r.status);
    e.code = r.status === 401 || r.status === 403 || r.status === 404 ? 'token_invalido' : 'http_' + r.status;
    return e;
  }
  function ghFetch(url, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + ghToken() }, opts.headers || {});
    opts.cache = 'no-store';
    return fetch(url, opts);
  }
  function ghLer() {
    return ghFetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_ARQ + '?ref=main&t=' + Date.now()).then(function (r) {
      if (!r.ok) throw erroGh(r);
      return r.json();
    }).then(function (j) { return { dados: JSON.parse(deB64(j.content)), sha: j.sha }; });
  }
  function gitDb() {
    var data = {}, listeners = [];
    function notify() { listeners.forEach(function (f) { f(); }); }
    function snap() { return { metadata: { fromCache: false }, docs: Object.keys(data).map(function (id) { var v = data[id]; return { id: id, data: function () { return v; } }; }) }; }
    function recarregar() {
      var p = ghToken()
        ? ghLer().then(function (x) { return x.dados; })
        : fetch('reunioes.json?v=' + Date.now(), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); });
      return p.then(function (d) { data = d || {}; notify(); });
    }
    function gravar(mutar, msg, jaTentou) {
      if (!ghToken()) { var e0 = new Error('sem token'); e0.code = 'sem_token'; return Promise.reject(e0); }
      return ghLer().then(function (x) {
        var d = x.dados;
        mutar(d);
        var corpo = { message: msg, content: paraB64(JSON.stringify(ordena(d), null, 1) + '\n'), sha: x.sha, branch: 'main' };
        return ghFetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_ARQ, { method: 'PUT', body: JSON.stringify(corpo) }).then(function (r) {
          if ((r.status === 409 || r.status === 422) && !jaTentou) return gravar(mutar, msg, true);
          if (!r.ok) throw erroGh(r);
          data = d;
          notify();
        });
      });
    }
    return {
      temToken: function () { return !!ghToken(); },
      recarregar: recarregar,
      doc: function (path) {
        var id = path.split('/')[1];
        return { update: function (patch) {
          return gravar(function (o) {
            if (!o[id]) { var e = new Error('nao existe'); e.code = 'invalid_argument'; throw e; }
            o[id] = Object.assign({}, o[id], patch);
          }, 'Registra ' + id + ': ' + (patch.status || 'atualiza'));
        } };
      },
      collection: function () {
        return {
          add: function (obj) {
            var id = 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            return gravar(function (o) { o[id] = obj; }, 'Adiciona reuniao ' + id);
          },
          onSnapshot: function (next, err) {
            listeners.push(function () { next(snap()); });
            recarregar().catch(function (e) { if (err) err(e); });
            return function () {};
          }
        };
      }
    };
  }

  function abrirToken() {
    if (document.getElementById('overlay-git')) return;
    var o = document.createElement('div');
    o.className = 'overlay';
    o.id = 'overlay-git';
    o.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="git-titulo">' +
      '<div class="modal-head"><div><h3 class="day-title" id="git-titulo">Conectar ao GitHub</h3><p class="sub" style="margin:2px 0 0">Para registrar as reuniões por esta página.</p></div><button class="x" id="git-fechar">Fechar</button></div>' +
      '<div class="modal-body"><p style="margin:0">Cole abaixo um token de acesso do GitHub. Ele fica guardado só neste navegador e não vai para o código.</p>' +
      '<ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px">' +
      '<li>Abra <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a>.</li>' +
      '<li>Em <b>Repository access</b>, escolha <b>Only select repositories</b> e marque <b>controle-de-agenda</b>.</li>' +
      '<li>Em <b>Repository permissions</b>, ponha <b>Contents</b> em <b>Read and write</b>.</li>' +
      '<li>Clique em <b>Generate token</b>, copie o código e cole aqui.</li></ol>' +
      '<div class="form" style="margin:0"><label class="wide">Token<input type="password" id="git-token" autocomplete="off" spellcheck="false"></label>' +
      '<button class="primary" id="git-salvar">Conectar</button></div>' +
      '<p class="sub" id="git-msg" style="margin:0;color:var(--bad)" role="alert"></p></div></div>';
    document.body.appendChild(o);
    var fechar = function () { var x = document.getElementById('overlay-git'); if (x) x.remove(); };
    document.getElementById('git-fechar').addEventListener('click', fechar);
    o.addEventListener('click', function (e) { if (e.target === o) fechar(); });
    document.getElementById('git-salvar').addEventListener('click', function () {
      var t = document.getElementById('git-token').value.trim();
      var msg = document.getElementById('git-msg');
      if (!t) { msg.textContent = 'Cole o token no campo.'; return; }
      msg.textContent = '';
      fetch('https://api.github.com/repos/' + GH_REPO, { headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + t }, cache: 'no-store' }).then(function (r) {
        if (!r.ok) { msg.textContent = 'O GitHub não aceitou esse token. Confira se copiou inteiro.'; return null; }
        return r.json();
      }).then(function (j) {
        if (!j) return;
        if (!j.permissions || !j.permissions.push) { msg.textContent = 'Esse token não tem permissão para gravar neste repositório. Refaça o passo 3.'; return; }
        ghSalvaToken(t);
        fechar();
        banner('');
        if (db && db.recarregar) db.recarregar().catch(function () {});
        renderSync();
      }).catch(function () { msg.textContent = 'Não consegui falar com o GitHub. Tente de novo.'; });
    });
    document.getElementById('git-token').focus();
  }
  function falhaGravar(e, verbo) {
    var c = e && e.code;
    if (c === 'sem_token') { banner('Para registrar, conecte a página ao GitHub.'); abrirToken(); }
    else if (c === 'token_invalido') { banner('O GitHub não aceitou o token. Conecte de novo.'); ghSalvaToken(''); renderSync(); abrirToken(); }
    else banner('Não foi possível ' + verbo + ' (' + (c || 'erro') + '). Tente de novo.');
    return false;
  }

  function assinar(d) {
    db = d;
    if (!modoLocal) d.doc('config/sync').onSnapshot(function (sn) { ultima = sn.exists ? sn.data() : null; renderSync(); }, function () {});
    timer = setTimeout(function () { banner('Ainda não consegui carregar os dados. Eles podem estar desatualizados.'); }, 10000);
    db.collection('reunioes').onSnapshot(function (snap) {
      if (!snap.metadata.fromCache) { clearTimeout(timer); okBanner(); }
      var next = {};
      snap.docs.forEach(function (s) { next[s.id] = Object.assign({}, s.data()); });
      docs = next;
      render();
    }, function (err) { clearTimeout(timer); banner('Erro ao carregar os dados (' + (err && err.code ? err.code : 'erro') + ').'); });
  }

  function iniciar() {
    if (!window.claude || !window.claude.use) { modoLocal = true; assinar(gitDb()); renderSync(); return; }
    window.claude.use('db').then(function (d) {
      if (!d) { banner('Entre na sua conta para ver e registrar as reuniões.'); return; }
      assinar(d);
      window.claude.use('mcp').then(function (m) { mcp = m; renderSync(); }).catch(function () {});
    });
  }
  iniciar();
})();
</script>
